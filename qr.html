<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>Shivaksha Restro | Table QR Codes</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="qr.css" />
  </head>
  <body class="qr-page">
    <main class="qr-main">
      <a class="back-link" href="index.html">Back to menu</a>
      <section class="qr-hero"><p>SHIVAKSHA RESTRO</p><h1>Table QR codes</h1><span>Print one code for each table. Scanning it opens the menu with that table number already selected.</span></section>
      <section class="qr-controls" aria-label="QR code settings"><label>Number of tables<input id="tableCount" type="number" min="1" max="100" value="20" inputmode="numeric" /></label><button id="generateButton" type="button">Generate QR codes</button><button id="printButton" class="secondary-button" type="button">Print</button></section>
      <p class="qr-note">The QR codes use the address of this page automatically. Upload the whole folder to your website before printing final copies.</p>
      <section id="qrGrid" class="qr-grid" aria-live="polite"></section>
    </main>
    <script src="qr.js"></script>
  </body>
</html>
